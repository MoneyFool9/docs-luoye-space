<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 600; }
      .desc { font-size: 16px; fill: #334155; }
      .box { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
      .box-strong { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; }
      .box-soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" />

  <!-- Host shell -->
  <rect class="box-strong" x="80" y="50" width="1040" height="140" rx="16" />
  <text class="title" x="600" y="95" text-anchor="middle">主应用 Shell</text>
  <text class="desc" x="600" y="130" text-anchor="middle">路由 / 布局 / 认证 / 设计系统 / 监控</text>

  <!-- Sub apps -->
  <rect class="box" x="100" y="260" width="300" height="160" rx="14" />
  <text class="label" x="250" y="310" text-anchor="middle">子应用 A</text>
  <text class="desc" x="250" y="345" text-anchor="middle">独立构建 / 独立发布</text>
  <text class="desc" x="250" y="372" text-anchor="middle">业务域 A</text>

  <rect class="box" x="450" y="260" width="300" height="160" rx="14" />
  <text class="label" x="600" y="310" text-anchor="middle">子应用 B</text>
  <text class="desc" x="600" y="345" text-anchor="middle">独立构建 / 独立发布</text>
  <text class="desc" x="600" y="372" text-anchor="middle">业务域 B</text>

  <rect class="box" x="800" y="260" width="300" height="160" rx="14" />
  <text class="label" x="950" y="310" text-anchor="middle">子应用 C</text>
  <text class="desc" x="950" y="345" text-anchor="middle">独立构建 / 独立发布</text>
  <text class="desc" x="950" y="372" text-anchor="middle">业务域 C</text>

  <!-- Shared layer -->
  <rect class="box-soft" x="140" y="480" width="920" height="160" rx="16" />
  <text class="label" x="600" y="525" text-anchor="middle">共享能力层</text>
  <text class="desc" x="600" y="560" text-anchor="middle">UI 组件库 / 设计系统 / 监控 SDK / 鉴权与基础工具</text>

  <!-- Arrows -->
  <line x1="250" y1="200" x2="250" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="200" x2="600" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="950" y1="200" x2="950" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="250" y1="420" x2="250" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="420" x2="600" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="950" y1="420" x2="950" y2="480" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Caption -->
  <text class="desc" x="600" y="690" text-anchor="middle">主应用负责治理与编排，子应用独立交付，共享能力统一沉淀</text>
</svg>
