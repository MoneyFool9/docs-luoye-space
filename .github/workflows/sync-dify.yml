name: Sync Docs to Dify

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '同步模式'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental   # 只同步本次改动过的文档（默认，快）
          - full          # 全量比对并更新所有文档
      merge:
        description: '按目录合并为分片文档（规避 Dify 文档数配额）'
        required: true
        default: true
        type: boolean
      prune:
        description: '删除本地已不存在的远端文档（会改变知识库内容）'
        required: true
        default: false
        type: boolean
      dry_run:
        description: '仅预演，不实际写入'
        required: true
        default: false
        type: boolean
      inspect:
        description: '诊断模式：文档名关键词（留空则不诊断）'
        required: false
        default: ''
        type: string
      probe:
        description: '探测分段行为（创建并删除临时文档）'
        required: true
        default: false
        type: boolean
      retrieve:
        description: '直查知识库召回（输入一个问题，留空则跳过）'
        required: false
        default: ''
        type: string
      dataset:
        description: '打印知识库配置（embedding 模型 / 索引方式）'
        required: true
        default: false
        type: boolean
      datasets:
        description: '列出账号下所有知识库（核对应用绑定的是哪个）'
        required: true
        default: false
        type: boolean
      audit:
        description: '审核文档与分段状态（含全文索引 keywords）'
        required: true
        default: false
        type: boolean

  # 文档变更后自动增量同步（确认稳定后取消注释即可启用）
  # push:
  #   branches: [main]
  #   paths: ['docs/**/*.md']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    name: 同步文档到 Dify 知识库

    env:
      DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
      DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL || 'https://api.dify.ai/v1' }}
      # 免费版限 10 次知识库请求/分钟，这里留出余量
      DIFY_THROTTLE_MS: '6500'

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          # 增量同步需要与上一个提交比对，必须拿到提交历史
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装脚本依赖
        # 同步脚本只依赖 glob / dotenv，无需为 VitePress 全量安装
        run: npm install --no-save --no-audit --no-fund glob@10 dotenv@16

      - name: 校验必要的 Secrets
        run: |
          missing=0
          [ -z "$DIFY_API_KEY" ] && { echo "::error::缺少 Secret：DIFY_API_KEY（知识库 API 密钥，dataset- 开头）"; missing=1; }
          [ -z "$DIFY_DATASET_ID" ] && { echo "::error::缺少 Secret：DIFY_DATASET_ID（知识库 ID）"; missing=1; }
          case "$DIFY_API_KEY" in
            app-*) echo "::error::DIFY_API_KEY 是应用 Token（app- 开头），知识库接口需要 dataset- 开头的密钥"; missing=1 ;;
          esac
          [ "$missing" = "1" ] && exit 1
          echo "✅ Secrets 校验通过"

      - name: 同步文档到 Dify
        run: |
          ARGS=""

          if [ "${{ inputs.probe }}" = "true" ]; then
            echo "🧪 探测分段行为"
            node scripts/sync-to-dify.mjs --probe
            echo ""
            echo "── 现状 ──"
            node scripts/sync-to-dify.mjs "--inspect=${{ inputs.inspect }}"
            exit 0
          fi

          if [ "${{ inputs.audit }}" = "true" ]; then
            echo "🔎 审核文档与分段状态"
            node scripts/sync-to-dify.mjs --audit
            exit 0
          fi

          if [ "${{ inputs.datasets }}" = "true" ]; then
            echo "📚 账号下所有知识库"
            node scripts/sync-to-dify.mjs --datasets
            exit 0
          fi

          if [ "${{ inputs.dataset }}" = "true" ]; then
            echo "📋 知识库配置"
            node scripts/sync-to-dify.mjs --dataset
            exit 0
          fi

          if [ -n "${{ inputs.retrieve }}" ]; then
            echo "🔍 直查知识库召回"
            node scripts/sync-to-dify.mjs "--retrieve=${{ inputs.retrieve }}"
            exit 0
          fi

          if [ -n "${{ inputs.inspect }}" ]; then
            echo "🔬 诊断模式：分段明细"
            node scripts/sync-to-dify.mjs "--inspect=${{ inputs.inspect }}"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "incremental" ]; then
              BASE="${{ github.event.before }}"
              case "$BASE" in
                ""|"0000000000000000000000000000000000000000") BASE="HEAD~1" ;;
              esac
              ARGS="$ARGS --changed-since=$BASE"
            fi
            [ "${{ inputs.merge }}" = "true" ] || ARGS="$ARGS --no-merge"
            [ "${{ inputs.prune }}" = "true" ] && ARGS="$ARGS --prune"
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          fi

          echo "🚀 node scripts/sync-to-dify.mjs $ARGS"
          node scripts/sync-to-dify.mjs $ARGS

      - name: 同步失败时输出排查提示
        if: failure()
        run: |
          {
            echo "### ❌ 文档同步失败"
            echo ""
            echo "常见原因："
            echo "- \`DIFY_API_KEY\` 或 \`DIFY_DATASET_ID\` 未配置 / 已失效"
            echo "- \`DIFY_API_KEY\` 误用了应用 Token（\`app-\` 开头），知识库接口需要 \`dataset-\` 开头的密钥"
            echo "- 超出 Dify 免费版配额（50 个知识库文档 / 50MB 存储）；分片模式约 18 篇可规避"
            echo "- 触发知识库请求限流（免费版 10 次/分钟）"
          } >> "$GITHUB_STEP_SUMMARY"
